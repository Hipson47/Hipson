# Copy to repos.yaml and adjust paths for your machine.
# Keep repos.yaml local and uncommitted.

repos:
  - name: Hipson
    path: .
    type: orchestrator
    progress: docs/hipson-progress.md
    owners:
      - Hipson
    tags:
      - orchestrator
      - local-first
    verification:
      - python3 scripts/run_tests.py
    risk_paths:
      - scripts
      - src/hipson/assets/codex-workflow-kit/global
      - src/hipson/assets/codex-workflow-kit/skills
      - skills/hipson-gpt

