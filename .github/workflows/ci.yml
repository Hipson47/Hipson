name: CI

on:
  push:
  pull_request:
  workflow_call:  # The release workflow runs the full matrix on the tagged commit before publishing.

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      CI: "true"  # Both runners reject skips outside the documented platform allowlist.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags since v8
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          uv pip install --system -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/hipson
      - name: Bandit
        run: bandit -q -r src -c pyproject.toml
      - name: Dependency audit
        if: runner.os == 'Linux'
        run: pip-audit
      - name: Run tests
        run: python scripts/run_tests.py
      - name: Pytest
        if: ${{ !cancelled() }}  # Run even when the standalone runner failed: pytest prints the tracebacks.
        run: python -m pytest -q -rfs --tb=short
      - name: Installed CLI ledger and MCP stdio smoke
        run: python -m pytest -q tests/test_cross_platform.py::test_installed_cli_and_mcp_smoke
      - name: Platform smoke script (what macOS testers run)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        env:
          SMOKE_SKIP_SUITES: "1"  # The suites already ran above.
        run: bash scripts/platform_smoke.sh
      - name: Mutation testing
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          mutmut run --max-children 2
          mutmut export-cicd-stats
          python scripts/mutation_gate.py
        timeout-minutes: 20
      - name: Compile Python
        run: python -m compileall src scripts tests
      - name: Build wheel and sdist
        run: uv build
      - name: Wheel smoke
        if: runner.os == 'Linux'
        run: |
          tmp="$(mktemp -d)"
          python -m venv "$tmp/venv"
          "$tmp/venv/bin/python" -m pip install dist/*.whl
          mkdir -p "$tmp/fake-project/config" "$tmp/fake-project/codex-workflow-kit/global"
          printf 'fake orchestrator\n' > "$tmp/fake-project/ORCHESTRATOR.md"
          printf '{"agents":{"fake":{}}}\n' > "$tmp/fake-project/config/agents.json"
          printf 'fake agents\n' > "$tmp/fake-project/codex-workflow-kit/global/AGENTS.md"
          cd "$tmp/fake-project"
          "$tmp/venv/bin/hipson" --help
          "$tmp/venv/bin/hipson" doctor
          "$tmp/venv/bin/hipson" skill validate
          "$tmp/venv/bin/hipson" work --task "security review of auth" --no-diff --json
          "$tmp/venv/bin/hipson" work --task "review current diff for test gaps" --no-diff --free-ai --json
          "$tmp/venv/bin/hipson" install codex --dry-run
          "$tmp/venv/bin/hipson" sidecar list | grep reviewer_cheap
      - name: Validate skills
        run: hipson skill validate
      - name: CLI smoke
        if: runner.os == 'Linux'
        run: |
          hipson --help
          hipson doctor
          hipson memory --memory-dir /tmp/hipson-memory list
          hipson work --task "security review of release diff" --no-diff --json
          hipson work --task "review current diff for test gaps" --no-diff --free-ai --json
          hipson sidecar route --task "security review of release diff" --risk security
          hipson sidecar route --task "security review of release diff" --risk security --task-type review --file src/hipson/agents.py --skills hipson-backend --context-chars 4200 --llm --llm-dry-run
          hipson install codex --dry-run
          hipson packet review --help
          hipson packet exec --help
          hipson sidecar list
      - name: Doctor
        if: runner.os == 'Linux'
        run: |
          cp repos.example.yaml repos.yaml
          hipson doctor
      - name: Scan temporary git repo
        if: runner.os == 'Linux'
        run: |
          tmp="$(mktemp -d)"
          git -C "$tmp" init -b main
          git -C "$tmp" config user.email test@example.com
          git -C "$tmp" config user.name "Test User"
          printf 'base\n' > "$tmp/file.txt"
          git -C "$tmp" add file.txt
          git -C "$tmp" commit -m base
          printf 'base\nchange\n' > "$tmp/file.txt"
          hipson scan "$tmp"
