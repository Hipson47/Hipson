name: Release to PyPI

# Publishes the sdist and wheel for a version tag (vX.Y.Z) through PyPI Trusted Publishing:
# no API token is stored anywhere. One-time setup is in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.2.1"
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags since v8
      - name: Tag must match the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/hipson/__init__.py").read()).group(1))')
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match pyproject version $version"; exit 1; }
          test "$version" = "$module" || { echo "src/hipson/__init__.py says $module, pyproject says $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata (PyPI rendering)
        run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          test "$(/tmp/wheel-venv/bin/hipson --version)" = "hipson ${TAG#v}"
          HIPSON_LEDGER=/tmp/smoke.sqlite /tmp/wheel-venv/bin/hipson task open --project . --title smoke --objective ok --json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hipson/
    permissions:
      id-token: write  # Trusted Publishing: PyPI exchanges this OIDC token for a short-lived upload token.
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
